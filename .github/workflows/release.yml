name: Publish mod release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mod-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runtime
        run: python -m pip install -r tools/requirements-test.txt
      - name: Rebuild and validate authored content
        run: |
          python -B tools/build.py
          git diff --exit-code -- data/placements.lua PLACEMENTS.csv PLACEMENTS.json EXCLUDED.csv tools/input_hashes.json
          python -B tools/test.py
      - name: Build installable ZIP
        run: python -B tools/package.py --output "$RUNNER_TEMP/mod-release"
      - name: Publish new manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')
          ID=$(python -c 'import json; print(json.load(open("manifest.json"))["id"])')
          NAME=$(python -c 'import json; print(json.load(open("manifest.json"))["name"])')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump manifest.json version for the next update."
            exit 0
          fi
          gh release create "$TAG" "$RUNNER_TEMP/mod-release/$ID-$VERSION.zip" \
            --target "$GITHUB_SHA" --title "$NAME $VERSION" --generate-notes \
            --notes "Import the attached $ID-$VERSION.zip in Gen1Recomp's mod manager. Requires native FireRed or LeafGreen on Gen1Recomp 0.2.73+. Offline validation runs against both editions before publishing; in-game playtesting is still recommended. See the repository README for encounter scope and placement details."
